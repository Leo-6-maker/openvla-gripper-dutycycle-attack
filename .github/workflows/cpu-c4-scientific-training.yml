name: cpu-c4-scientific-training

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  c4-training-cpu:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy
      - name: Compile wrapper
        run: python -m py_compile tools/multisuite_detector/train_c4_scientific_detector_v1.py
      - name: Run wrapper tests
        run: pytest tests/multisuite_detector/test_train_c4_scientific_detector_v1.py -q
