name: cpu-c2g-canonical-strict

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  canonical-strict-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile strict canonical binding path
        run: |
          python -m py_compile \
            scripts/stageb/verify_c2g_collection_model_provenance.py \
            tests/test_c2g_collection_model_verification.py
      - name: Check strict canonical Bash syntax
        run: |
          bash -n scripts/stageb/run_c2g_clean_window_pipeline.sh
          bash -n scripts/stageb/run_c2g_clean_window_pipeline_strict.sh
      - name: Run strict canonical binding tests
        run: |
          python -m unittest -v \
            tests.test_c2g_collection_model_binding \
            tests.test_c2g_collection_model_verification \
            tests.test_c2g_model_provenance \
            tests.test_c2g_release_runtime_audit
      - name: Verify worktree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- generated audit_outputs paper/generated artifacts)"
