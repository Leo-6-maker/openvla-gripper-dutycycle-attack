name: cpu-r10-4-r4

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  r10-4-r4-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile R10.4-R4 tools
        run: |
          python -m py_compile \
            src/gripper_attack/r10_4_runtime.py \
            scripts/r10_4/audit_runtime_integration.py \
            scripts/r10_4/replay_libero_feature_parity.py
      - name: Run R10.4-R4 CPU contract tests
        run: pytest -q tests/test_r10_4_runtime.py
      - name: Run AST/injected runtime audit
        run: python scripts/r10_4/audit_runtime_integration.py
      - name: Check patch whitespace
        run: git diff --check
