name: cpu-stageb

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stageb-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow
      - name: Compile Stage-B tooling
        run: |
          python -m py_compile \
            scripts/stageb/run_sc5_cross_suite_clean.py \
            scripts/stageb/run_sc5_cross_suite_clean_queue.py \
            scripts/stageb/audit_cross_suite_clean_300_postrun.py \
            scripts/stageb/audit_existing_nonobject_clean_outputs.py \
            scripts/stageb/build_paper_table_schemas.py \
            scripts/stageb/build_teacher_label_eval_table.py \
            scripts/stageb/audit_github_branch_pr_hygiene.py \
            tools/multisuite_detector/build_clean2000_label_v2.py \
            tools/multisuite_detector/load_label_v2_artifact.py \
            tools/multisuite_detector/detector_dataset_closure_v1.py \
            tools/multisuite_detector/load_frozen_clean_features.py \
            tools/multisuite_detector/build_detector_dataset_manifest_v1.py \
            tools/multisuite_detector/build_detector_splits_v1.py \
            tools/multisuite_detector/build_detector_normalization_v1.py \
            tools/multisuite_detector/validate_detector_dataset_manifest_v1.py \
            tools/multisuite_detector/extract_formal_25d_features_v1.py \
            tools/multisuite_detector/validate_formal_25d_features_v1.py \
            tools/multisuite_detector/audit_clean_rollout_feature_sources_v1.py \
            tools/multisuite_detector/prepare_formal_25d_feature_extraction_readiness_v1.py \
            tools/multisuite_detector/build_formal_25d_source_csv_v1.py \
            tools/multisuite_detector/feature_binding_manifest_v1.py \
            tools/multisuite_detector/validate_feature_binding_v1.py \
            tools/multisuite_detector/feature_binding_summary_report_v1.py \
            tools/multisuite_detector/validate_c4_bundle_audit_v1.py \
            tools/multisuite_detector/build_c4_scientific_splits_v1.py
      - name: Run targeted CPU tests
        run: |
          pytest \
            tests/stageb/test_cross_suite_postrun_audit_tools.py \
            tests/stageb/test_cross_suite_clean_queue.py \
            tests/stageb/test_cross_suite_clean_collector.py \
            tests/stageb/test_cross_suite_task_inventory.py \
            tests/test_build_clean2000_label_v2.py \
            tests/test_load_label_v2_artifact.py \
            tests/multisuite_detector/test_detector_dataset_closure_v1.py \
            tests/multisuite_detector/test_extract_formal_25d_features_v1.py \
            tests/multisuite_detector/test_validate_formal_25d_features_v1.py \
            tests/multisuite_detector/test_initial_state_hash_provenance_v1.py \
            tests/multisuite_detector/test_feature_binding_manifest_v1.py \
            tests/multisuite_detector/test_validate_feature_binding_v1.py \
            tests/multisuite_detector/test_detector_dataset_manifest_v1.py \
            tests/multisuite_detector/test_validate_c4_bundle_audit_v1.py \
            tests/multisuite_detector/test_build_c4_scientific_splits_v1.py \
            -q
      - name: Run Label V2 closeout self-test
        run: python tools/multisuite_detector/build_clean2000_label_v2.py --mode self-test-closeout
      - name: Report Label V2 producer identity
        run: |
          git rev-parse HEAD
          sha256sum tools/multisuite_detector/build_clean2000_label_v2.py
      - name: Block generated outputs in git
        shell: python
        run: |
          from pathlib import Path
          bad = []
          for root in ["generated", "audit_outputs", "paper/generated", "artifacts"]:
              bad += [p for p in Path(root).rglob("*") if p.is_file()]
          if bad:
              raise SystemExit("Generated outputs must stay out of git:\n" + "\n".join(map(str, bad[:50])))
