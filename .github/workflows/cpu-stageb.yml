name: cpu-stageb

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stageb-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow pyyaml imageio
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Stage-B tooling
        run: |
          python -m compileall -q scripts/stageb
      - name: Run Stage-B CPU tests
        run: |
          pytest tests/stageb -q
      - name: Block generated evidence dumps in git
        shell: python
        run: |
          from pathlib import Path
          forbidden = ["generated", "audit_outputs", "paper/generated", "artifacts"]
          bad = [p for root in forbidden for p in Path(root).rglob("*") if p.is_file()]
          if bad:
              raise SystemExit("Generated evidence files must stay out of git:\n" + "\n".join(map(str, bad[:50])))
