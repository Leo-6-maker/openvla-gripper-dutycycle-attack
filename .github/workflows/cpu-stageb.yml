name: cpu-stageb

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stageb-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow pyyaml imageio
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Stage-B tooling
        run: |
          python -m py_compile \
            scripts/stageb/run_sc5_cross_suite_clean.py \
            scripts/stageb/run_sc5_cross_suite_clean_queue.py \
            scripts/stageb/audit_cross_suite_clean_300_postrun.py \
            scripts/stageb/audit_existing_nonobject_clean_outputs.py \
            scripts/stageb/build_paper_table_schemas.py \
            scripts/stageb/build_teacher_label_eval_table.py \
            scripts/stageb/audit_github_branch_pr_hygiene.py \
            scripts/stageb/layer3_exact_branching_contract.py \
            scripts/stageb/layer3_exact_restore_runner.py \
            scripts/stageb/audit_c2_control_ablation_application.py
      - name: Run Stage-B CPU tests
        run: |
          pytest tests/stageb -q
      - name: Block generated evidence dumps in git
        shell: python
        run: |
          from pathlib import Path
          forbidden = ["generated", "audit_outputs", "paper/generated", "artifacts"]
          bad = [p for root in forbidden for p in Path(root).rglob("*") if p.is_file()]
          if bad:
              raise SystemExit("Generated evidence files must stay out of git:\n" + "\n".join(map(str, bad[:50])))
