name: cpu-stageb

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  stageb-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow
      - name: Compile Stage-B tooling
        run: |
          python -m py_compile \
            scripts/stageb/run_sc5_cross_suite_clean.py \
            scripts/stageb/run_sc5_cross_suite_clean_queue.py \
            scripts/stageb/audit_cross_suite_clean_300_postrun.py \
            scripts/stageb/audit_existing_nonobject_clean_outputs.py \
            scripts/stageb/build_paper_table_schemas.py \
            scripts/stageb/build_teacher_label_eval_table.py \
            scripts/stageb/audit_github_branch_pr_hygiene.py \
            src/gripper_attack/b3_retention.py \
            scripts/detector/materialize_b3_retention_episode.py \
            scripts/detector/audit_b3_retention_materialization.py \
            scripts/detector/audit_b3_retention_real_artifacts.py \
            scripts/detector/freeze_b3_s0_summary.py
      - name: Run targeted CPU tests
        run: |
          pytest \
            tests/test_b3_retention_multievent.py \
            tests/test_b3_retention_materializer.py \
            tests/test_b3_retention_real_artifact_audit.py \
            tests/stageb/test_cross_suite_postrun_audit_tools.py \
            tests/stageb/test_cross_suite_clean_queue.py \
            tests/stageb/test_cross_suite_clean_collector.py \
            tests/stageb/test_cross_suite_task_inventory.py \
            -q
      - name: Block generated evidence dumps in git
        shell: python
        run: |
          from pathlib import Path
          forbidden = ["generated", "audit_outputs", "paper/generated", "artifacts"]
          bad = [p for root in forbidden for p in Path(root).rglob("*") if p.is_file()]
          if bad:
              raise SystemExit("Generated evidence files must stay out of git:\n" + "\n".join(map(str, bad[:50])))
