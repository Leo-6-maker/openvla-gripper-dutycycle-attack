name: cpu-c2g-static

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  c2g-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pytest pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile complete C2g pipeline and Track A modules
        run: |
          python -m py_compile \
            scripts/stageb/audit_c2f_track_a_run.py \
            scripts/stageb/audit_c2g_matched_load_run.py \
            scripts/stageb/build_c2g_matched_load_jobs.py \
            scripts/stageb/collect_c2g_clean_window_rollouts.py \
            scripts/stageb/extract_c2g_detector_timing.py \
            scripts/stageb/prepare_c2g_eval_parents.py \
            scripts/stageb/run_c2f_canary_worker.py \
            scripts/stageb/run_c2g_clean_timing_jobs.py \
            scripts/stageb/run_c2g_clean_window_vis_pgd.py \
            scripts/stageb/run_c2g_matched_load_jobs.py \
            src/gripper_attack/c2g_bddl_metadata.py \
            src/gripper_attack/c2g_causal_vulnerability_detector.py \
            src/gripper_attack/c2g_clean_mechanism.py \
            src/gripper_attack/c2g_clean_policy_signals.py \
            src/gripper_attack/c2g_clean_window_runtime.py \
            src/gripper_attack/c2g_clean_window_schema.py \
            src/gripper_attack/c2g_counterfactual_manifest.py \
            src/gripper_attack/c2g_gripper_critical_window_detector.py \
            src/gripper_attack/c2g_matched_load_manifest.py \
            src/gripper_attack/c2g_semantic_aliases.py \
            src/gripper_attack/c2g_teacher_v2_contact_identity.py \
            src/gripper_attack/c2g_teacher_v2_schema.py \
            src/gripper_attack/c2g_teacher_v2_target_resolution.py \
            tools/multisuite_detector/audit_c2f_teacher_v1_labels.py \
            tools/multisuite_detector/audit_c2g_clean_window_v2.py \
            tools/multisuite_detector/audit_c2g_static_assets.py \
            tools/multisuite_detector/audit_c2g_static_assets_strict.py \
            tools/multisuite_detector/c2g_clean_dataset_adapter.py \
            tools/multisuite_detector/c2g_clean_window_label_builder.py \
            tools/multisuite_detector/c2g_dataset_scaffold.py \
            tools/multisuite_detector/materialize_c2g_clean_window_dataset.py \
            tools/multisuite_detector/materialize_c2g_multisuite_dataset.py \
            tools/multisuite_detector/run_c2g_clean_window_folds.py \
            tools/multisuite_detector/train_c2g_clean_window_detector.py \
            tests/test_c2g_clean_window_e2e.py \
            tests/test_c2g_clean_window_pipeline_tools.py \
            tests/test_c2g_clean_window_server_audit.py \
            tests/test_c2g_clean_window_v2.py \
            tests/test_c2g_matched_load_strict.py \
            tests/test_c2g_s1_semantic_remediation.py
      - name: Check launcher syntax
        run: |
          bash -n scripts/stageb/run_c2f_track_a_smoke5.sh
          bash -n scripts/stageb/run_c2f_table1_candidate_gpu17.sh
          bash -n scripts/stageb/run_c2g_clean_window_end_to_end.sh
      - name: Run complete C2g static suite
        run: |
          python -m unittest -v \
            tests.test_c2f_track_a_static \
            tests.test_c2g_static \
            tests.test_c2g_p0_patch \
            tests.test_c2g_teacher_v2_target_resolution \
            tests.test_c2g_teacher_v2_contact_identity \
            tests.test_c2g_teacher_v2_schema \
            tests.test_c2g_counterfactual_manifest \
            tests.test_c2g_static_asset_inventory \
            tests.test_c2g_clean_window_v2 \
            tests.test_c2g_clean_window_server_audit \
            tests.test_c2g_clean_window_e2e \
            tests.test_c2g_clean_window_pipeline_tools \
            tests.test_c2g_matched_load_strict \
            tests.test_c2g_s1_semantic_remediation
      - name: Verify tracked code and protected outputs unchanged
        shell: python
        run: |
          import subprocess

          subprocess.run(["git", "diff", "--exit-code"], check=True)
          protected = ["generated", "audit_outputs", "paper/generated", "artifacts"]
          status = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--", *protected],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if status:
              raise SystemExit(
                  "Static tests must not create or modify protected output paths:\n" + status
              )
