            tests/test_c2g_r8w_full_clean_collector.py \
            tests/test_c2g_r8w_16worker_scheduler.py \
            tests/test_c2g_r8w_full_clean_audit.py \
            tests/test_c2g_r8x_hardware_bound_repro.py \
            tests/test_c2g_official_suite_horizons.py \
            tests/test_c2g_r8y_l10_520_plan.py \
            tests/test_c2g_r8y_dynamic_admission.py \
            tests/test_c2g_r8y_l10_520_canary_audit.py \
            tests/test_c2g_r8y_l10_520_full_audit.py \
            tests/test_c2g_s1_semantic_remediation.py \
            tests/test_c2g_server_resume_hardening.py
      - name: Check launcher syntax
        run: |
          bash -n scripts/stageb/run_c2f_track_a_smoke5.sh
          bash -n scripts/stageb/run_c2f_table1_candidate_gpu17.sh
          bash -n scripts/stageb/run_c2g_clean_window_end_to_end.sh
          bash -n scripts/stageb/run_c2g_clean_window_pipeline.sh
          bash -n scripts/stageb/run_c2g_clean_window_pipeline_strict.sh
          bash -n scripts/stageb/run_c2g_r6_dataset_audit.sh
          bash -n scripts/stageb/run_c2g_r7_corpus_planning.sh
          bash -n scripts/stageb/run_c2g_r8r_clean2000_reuse_audit.sh
          bash -n scripts/stageb/run_c2g_r8r_input_for_r8s.sh
          bash -n scripts/stageb/run_c2g_r8s_teacher_v1_semantic_replay_audit.sh
      - name: Run complete C2g static suite
        run: |
          python -m unittest -v \
            tests.test_c2f_track_a_static \
            tests.test_c2g_static \
            tests.test_c2g_p0_patch \
            tests.test_c2g_teacher_v2_target_resolution \
            tests.test_c2g_teacher_v2_contact_identity \
            tests.test_c2g_teacher_v2_schema \
            tests.test_c2g_counterfactual_manifest \
            tests.test_c2g_static_asset_inventory \
            tests.test_c2g_clean_window_v2 \
            tests.test_c2g_clean_window_server_audit \
            tests.test_c2g_clean_window_e2e \
            tests.test_c2g_clean_window_pipeline_tools \
            tests.test_c2g_dataset_trainability \
            tests.test_c2g_event_teacher_integration \
            tests.test_c2g_goal_event_tracking \
            tests.test_c2g_goal_manifest_v2_contract \
            tests.test_c2g_goal_model_integrity_v2 \
            tests.test_c2g_matched_load_strict \
            tests.test_c2g_r6_bound_dataset_audit \
            tests.test_c2g_r7_scientific_corpus \
            tests.test_c2g_r8_collection_control \
            tests.test_c2g_r8_real_schema_compat \
            tests.test_c2g_r8r_clean2000_reuse_audit \
            tests.test_c2g_r8r_launcher_contract \
            tests.test_c2g_r8s_teacher_v1_semantic_replay \
            tests.test_c2g_r8s_launcher_contract \
            tests.test_c2g_r8t_teacher_v2_canary \
            tests.test_c2g_r8u_postcanary \
            tests.test_c2g_r8u_adaptive_gpu_preview \
            tests.test_c2g_r8w_full_clean_plan \
            tests.test_c2g_r8w_full_clean_collector \
            tests.test_c2g_r8w_16worker_scheduler \
            tests.test_c2g_r8w_full_clean_audit \
            tests.test_c2g_r8x_hardware_bound_repro \
            tests.test_c2g_official_suite_horizons \
            tests.test_c2g_r8y_l10_520_plan \
            tests.test_c2g_r8y_dynamic_admission \
            tests.test_c2g_r8y_l10_520_canary_audit \
            tests.test_c2g_r8y_l10_520_full_audit \
            tests.test_c2g_s1_semantic_remediation \
            tests.test_c2g_server_resume_hardening
      - name: Verify tracked code and protected outputs unchanged
        shell: python
        run: |
          import subprocess

          subprocess.run(["git", "diff", "--exit-code"], check=True)
          protected = ["generated", "audit_outputs", "paper/generated", "artifacts"]
          status = subprocess.run(
              ["git", "status", "--porcelain", "--untracked-files=all", "--", *protected],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          if status:
              raise SystemExit(
                  "Static tests must not create or modify protected output paths:\n" + status
              )
