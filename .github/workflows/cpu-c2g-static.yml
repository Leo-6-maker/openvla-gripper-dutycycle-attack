name: cpu-c2g-static

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  c2g-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pytest pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile complete C2g pipeline and Track A modules
        run: |
          python -m py_compile \
            scripts/stageb/audit_c2f_track_a_run.py \
            scripts/stageb/audit_c2g_matched_load_run.py \
            scripts/stageb/build_c2g_matched_load_jobs.py \
            scripts/stageb/build_c2g_suite_model_map.py \
            scripts/stageb/collect_c2g_clean_window_rollouts.py \
            scripts/stageb/collect_c2g_clean_window_rollouts_event_v2.py \
            scripts/stageb/collect_c2g_clean_window_rollouts_release.py \
            scripts/stageb/collect_c2g_clean_window_rollouts_strict.py \
            scripts/stageb/collect_c2g_r8t_teacher_v2_canary.py \
            scripts/stageb/collect_c2g_r8w_teacher_v2_clean.py \
            scripts/stageb/extract_c2g_detector_timing.py \
            scripts/stageb/finalize_c2g_goal_model_manifest_v2.py \
            scripts/stageb/prepare_c2g_eval_parents.py \
            scripts/stageb/run_c2f_canary_worker.py \
            scripts/stageb/run_c2g_clean_timing_jobs.py \
            scripts/stageb/run_c2g_clean_timing_jobs_strict.py \
            scripts/stageb/run_c2g_clean_window_vis_pgd.py \
            scripts/stageb/run_c2g_matched_load_jobs.py \
            scripts/stageb/run_c2g_matched_load_jobs_map_release.py \
            scripts/stageb/run_c2g_r8_collection_shard.py \
            scripts/stageb/run_c2g_r8t_dynamic_gpu_canary.py \
            scripts/stageb/replay_c2g_r8t_canary_success.py \
            scripts/stageb/run_c2g_r8t_teacher_v2_canary_shard.py \
            scripts/stageb/run_c2g_r8u_adaptive_gpu_preview.py \
            scripts/stageb/run_c2g_r8w_full_clean_shard.py \
            scripts/stageb/run_c2g_r8w_gpu4567_16worker.py \
            scripts/stageb/run_c2g_r8y_l10_520_shard.py \
            scripts/stageb/run_c2g_r8y_l10_520_dynamic_scheduler.py \
            src/gripper_attack/c2g_bddl_metadata.py \
            src/gripper_attack/c2g_causal_vulnerability_detector.py \
