            tools/multisuite_detector/audit_c2g_r8t_teacher_v2_canary.py \
            tools/multisuite_detector/audit_c2g_r8u_postcanary.py \
            tools/multisuite_detector/audit_c2g_r8w_full_clean_2000.py \
            tools/multisuite_detector/audit_c2g_static_assets.py \
            tools/multisuite_detector/audit_c2g_static_assets_strict.py \
            tools/multisuite_detector/build_c2g_r8_collection_waves.py \
            tools/multisuite_detector/build_c2g_r8r_clean2000_source_spec.py \
