            tools/multisuite_detector/build_c2g_r8w_full_clean_2000_plan.py \
            tools/multisuite_detector/build_c2g_r8y_l10_520_plan.py \
            tools/multisuite_detector/c2g_official_suite_horizons.py \
            tools/multisuite_detector/audit_c2g_r8y_l10_520_canary.py \
            tools/multisuite_detector/audit_c2g_r8y_l10_520_full500.py \
            tools/multisuite_detector/c2g_clean_dataset_adapter.py \
            tools/multisuite_detector/c2g_clean_window_label_builder.py \
            tools/multisuite_detector/c2g_dataset_scaffold.py \
            tools/multisuite_detector/c2g_r8r_common.py \
            tools/multisuite_detector/c2g_r8r_episode.py \
            tools/multisuite_detector/c2g_r8r_outputs.py \
            tools/multisuite_detector/c2g_r8s_common.py \
            tools/multisuite_detector/c2g_r8s_episode.py \
            tools/multisuite_detector/materialize_c2g_clean_window_dataset.py \
            tools/multisuite_detector/materialize_c2g_multisuite_dataset.py \
            tools/multisuite_detector/plan_c2g_scientific_corpus.py \
            tools/multisuite_detector/run_c2g_clean_window_folds.py \
            tools/multisuite_detector/train_c2g_clean_window_detector.py \
            tests/test_c2g_clean_window_e2e.py \
            tests/test_c2g_clean_window_pipeline_tools.py \
            tests/test_c2g_clean_window_server_audit.py \
            tests/test_c2g_clean_window_v2.py \
            tests/test_c2g_event_teacher_integration.py \
            tests/test_c2g_goal_event_tracking.py \
