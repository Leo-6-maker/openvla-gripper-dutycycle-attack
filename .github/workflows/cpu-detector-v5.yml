name: cpu-detector-v5

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detector-v5-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile V5, R7, and R8 development contracts
        run: |
          python -m py_compile \
            src/gripper_attack/v5_protocol.py \
            src/gripper_attack/v5_ranker.py \
            src/gripper_attack/v5_scheduler.py \
            src/gripper_attack/v5_teacher.py \
            src/gripper_attack/v5_physics.py \
            src/gripper_attack/v5_dataset.py \
            scripts/detector_v5/audit_v5_input_availability.py \
            scripts/detector_v5/build_v5_teacher_utility.py \
            scripts/detector_v5/build_v5_physics_teacher.py \
            scripts/detector_v5/audit_v5_physics_teacher.py \
            scripts/detector_v5/audit_v5_teacher_utility.py \
            scripts/detector_v5/train_v5_proprio_fit_smoke.py \
            scripts/detector_v5/train_v5_proprio_development.py \
            scripts/detector_v5/audit_v5_window_geometry.py \
            scripts/detector_v5/build_v5_stratified_smoke_subset.py \
            scripts/detector_v5/run_v5_window_baselines.py \
            scripts/detector_v5/evaluate_v5_causal_online.py \
            scripts/detector_v5/review_v5_ab_working_point.py \
            scripts/detector_v5/audit_v5_checkpoint.py \
            scripts/detector_v5/audit_v5_prediction_bundle.py \
            scripts/detector_v5/audit_v5_physics_task_decoder.py \
            scripts/detector_v5/audit_clean2000_raw_assets.py \
            scripts/detector_v5/audit_official_v3_fit_sources.py \
            scripts/detector_v4/label_k10_v121.py \
            scripts/detector_v4/audit_k10_v121_artifact.py \
            scripts/detector_v4/replay_k10_v5_v22_closure.py \
            scripts/detector_v4/audit_k10_v5_v22_artifact.py \
            scripts/detector_v4/train_k10_detector_v3.py \
            scripts/detector_v4/audit_k10_detector_v3.py \
            scripts/detector_v4/census_r8_official_v3_artifacts.py
      - name: Run V5, R7, and R8 CPU contract tests
        run: |
          pytest -q \
            tests/test_v5_contracts.py \
            tests/test_v5_dataset.py \
            tests/test_v5_window_geometry.py \
            tests/test_v5_loss_v2.py \
            tests/test_v5_online_evaluator.py \
            tests/test_v5_baselines.py \
            tests/test_v5_physics_decoder.py \
            tests/test_v5_physics_teacher.py \
            tests/test_clean2000_raw_asset_audit.py \
            tests/test_official_v3_fit_sources.py \
            tests/test_r7_k10_v121.py \
            tests/test_r7_k10_v121_auditor.py \
            tests/test_r7_k10_v22_closure.py \
            tests/test_r7_k10_v3_training.py \
            tests/test_r8_visual_recoverability_census.py
      - name: Check patch whitespace
        run: git diff --check
