name: cpu-detector-v5

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  detector-v5-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile V5 development contracts
        run: |
          python -m py_compile \
            src/gripper_attack/v5_protocol.py \
            src/gripper_attack/v5_ranker.py \
            src/gripper_attack/v5_scheduler.py \
            src/gripper_attack/v5_teacher.py \
            scripts/detector_v5/audit_v5_input_availability.py \
            scripts/detector_v5/build_v5_teacher_utility.py \
            scripts/detector_v5/audit_v5_teacher_utility.py
      - name: Run V5 CPU contract tests
        run: pytest -q tests/test_v5_contracts.py
      - name: Check patch whitespace
        run: git diff --check
