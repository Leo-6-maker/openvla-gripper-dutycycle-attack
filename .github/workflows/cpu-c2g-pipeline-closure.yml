name: cpu-c2g-pipeline-closure

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pipeline-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile pipeline closure entry points
        run: |
          python -m py_compile \
            scripts/stageb/analyze_c2g_matched_load_results.py \
            scripts/stageb/build_c2g_clean_manifests.py \
            scripts/stageb/build_c2g_matched_load_jobs.py \
            scripts/stageb/prepare_c2g_eval_parents.py \
            scripts/stageb/run_c2g_matched_load_jobs.py \
            tools/multisuite_detector/validate_c2g_clean_window_dataset.py \
            tests/test_c2g_clean_manifest_builder.py \
            tests/test_c2g_result_analysis.py
      - name: Check full orchestrator syntax
        run: |
          bash -n scripts/stageb/run_c2g_clean_window_end_to_end.sh
          bash -n scripts/stageb/run_c2g_clean_window_full.sh
      - name: Run closure tests
        run: |
          python -m unittest -v \
            tests.test_c2g_clean_manifest_builder \
            tests.test_c2g_result_analysis \
            tests.test_c2g_dataset_trainability \
            tests.test_c2g_matched_load_strict
      - name: Verify worktree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- generated audit_outputs paper/generated artifacts)"
