name: cpu-c2g-collector-strict

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  strict-collector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile strict collection entry points
        run: |
          python -m py_compile \
            scripts/stageb/collect_c2g_clean_window_rollouts.py \
            scripts/stageb/collect_c2g_clean_window_rollouts_strict.py \
            scripts/stageb/build_c2g_clean_manifests.py \
            tests/test_c2g_clean_collector_strict.py \
            tests/test_c2g_clean_manifest_builder.py
      - name: Check production wrapper syntax
        run: |
          bash -n scripts/stageb/run_c2g_clean_window_full.sh
          bash -n scripts/stageb/run_c2g_clean_window_production.sh
      - name: Run strict collection contract tests
        run: |
          python -m unittest -v \
            tests.test_c2g_clean_collector_strict \
            tests.test_c2g_clean_manifest_builder
      - name: Verify worktree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- generated audit_outputs paper/generated artifacts)"
