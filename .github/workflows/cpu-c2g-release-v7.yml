name: cpu-c2g-release-v7

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-v7-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install numpy pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile release-v7 audit path
        run: |
          python -m py_compile \
            scripts/stageb/audit_c2g_matched_load_run_release.py \
            tests/test_c2g_release_runtime_audit.py
      - name: Check release-v7 Bash syntax
        run: |
          bash -n scripts/stageb/run_c2g_clean_window_release_v7.sh
      - name: Run release-v7 contract tests
        run: |
          python -m unittest -v \
            tests.test_c2g_release_runtime_audit \
            tests.test_c2g_model_provenance \
            tests.test_c2g_release_job_builder \
            tests.test_c2g_release_manifest_builder \
            tests.test_c2g_release_v2 \
            tests.test_c2g_clean_collector_strict \
            tests.test_c2g_clean_susceptibility \
            tests.test_c2g_dataset_trainability \
            tests.test_c2g_matched_load_strict \
            tests.test_c2g_result_analysis
      - name: Verify worktree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all -- generated audit_outputs paper/generated artifacts)"
