stage: D2.1
mode: clean_rollout_only
attack_forbidden: true

universe:
  tasks: 10
  states_per_task: 50
  expected_total: 500
  existing: 402  # from E4C.1
  fresh_collected: 6  # from D2.0 (alphabet_soup s0,s3,s4,s5,s6,s7)
  remaining: 92

rollout:
