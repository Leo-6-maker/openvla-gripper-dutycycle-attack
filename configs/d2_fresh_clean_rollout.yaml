infra:
  runner_repo: /data/liuyu/repos/codex_stageb_openvla_alignment_rc1a_20260607
  runner_script: scripts/stageb/run_s20d_v4_fixed_window_l3_runner.py
  python: /home/liuyu/.conda/envs/openvla_official_libero_20260525/bin/python
